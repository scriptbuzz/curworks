  <text x="226" y="184" font-size="21" fill="#DCE6F2">AWS cost report workbooks, from Amazon S3</text>
  <text x="226" y="211" font-size="21" fill="#DCE6F2">to your Excel macros and back. Nothing is</text>
  <text x="226" y="238" font-size="21" fill="#DCE6F2">left on the laptop when you're done.</text>
  <text x="226" y="276" font-size="14" font-weight="700" fill="#9FD8D2" letter-spacing="1.2">BETA 0.013  ·  DRAFT - FOR INTERNAL USE (FPT)</text>
