<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
<title id="t">CurWork</title>
<desc id="d">AWS cost report workbooks, from Amazon S3 to your Excel macros and back, with nothing left on the laptop.</desc>
<defs>
