    <rect x="896" y="72" width="140" height="44" rx="22" fill="#FFFFFF"/><text x="966" y="99" fill="#0B2545">Amazon S3</text>
    <rect x="896" y="138" width="140" height="44" rx="22" fill="#0F8B80"/><text x="966" y="165" fill="#FFFFFF">In  →  macros</text>
    <rect x="896" y="204" width="140" height="44" rx="22" fill="#FFFFFF"/><text x="966" y="231" fill="#0B2545">Out  →  S3</text>
