<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"><defs><marker id="a5F6B7A" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5F6B7A"/></marker><marker id="a0F8B80" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F8B80"/></marker><marker id="a0B2545" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B2545"/></marker><marker id="aB42318" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker><marker id="a1F4E89" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E89"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="42" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0F8B80" font-weight="bold" text-anchor="start" letter-spacing="1.5">EXHIBIT 3</text><text x="40" y="72" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#0B2545" font-weight="bold" text-anchor="start" >How AWS details stay off GitHub</text><text x="40" y="98" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5F6B7A" font-weight="normal" text-anchor="start" >Private values live in one file on your Mac. Two automatic checks stop them before they can be uploaded.</text><line x1="40" y1="114" x2="1160" y2="114" stroke="#0B2545" stroke-width="2"/><rect x="40" y="140" width="290" height="170" rx="8" fill="#0B2545" stroke="#0B2545" stroke-width="1"/><text x="60" y="172" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#FFFFFF" font-weight="bold" text-anchor="start" >curwork_test.env</text><text x="60" y="194" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#DCE6F2" font-weight="normal" text-anchor="start" >on your Mac only</text><text x="60" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#FFFFFF" font-weight="normal" text-anchor="start" >Account number</text><text x="60" y="249" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#FFFFFF" font-weight="normal" text-anchor="start" >Admin profile name</text><text x="60" y="270" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#FFFFFF" font-weight="normal" text-anchor="start" >Sign-in address and Region</text><text x="60" y="296" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9FD8D2" font-weight="bold" text-anchor="start" >Never uploaded (.gitignore)</text><line x1="185" y1="310" x2="185" y2="372" stroke="#5F6B7A" stroke-width="2" marker-end="url(#a5F6B7A)"/><text x="197" y="346" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5F6B7A" font-weight="normal" text-anchor="start" >test scripts read it</text><rect x="40" y="380" width="290" height="80" rx="6" fill="#FFFFFF" stroke="#C9D2DD" stroke-width="1"/><text x="60" y="412" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0B2545" font-weight="bold" text-anchor="start" >Test scripts and the app</text><text x="60" y="436" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B7A" font-weight="normal" text-anchor="start" >No AWS details written in the code</text><rect x="400" y="190" width="170" height="90" rx="6" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.5"/><text x="485" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0B2545" font-weight="bold" text-anchor="middle" >Your change</text><text x="485" y="252" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B7A" font-weight="normal" text-anchor="middle" >git commit</text><rect x="590" y="190" width="170" height="90" rx="6" fill="#0F8B80" stroke="#0F8B80" stroke-width="1.5"/><text x="675" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >Check 1</text><text x="675" y="252" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="normal" text-anchor="middle" >before every commit</text><rect x="780" y="190" width="170" height="90" rx="6" fill="#0F8B80" stroke="#0F8B80" stroke-width="1.5"/><text x="865" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >Check 2</text><text x="865" y="252" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="normal" text-anchor="middle" >before every push</text><rect x="970" y="190" width="170" height="90" rx="6" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.5"/><text x="1055" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0B2545" font-weight="bold" text-anchor="middle" >GitHub</text><text x="1055" y="252" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B7A" font-weight="normal" text-anchor="middle" >the repository</text><line x1="570" y1="235" x2="586" y2="235" stroke="#5F6B7A" stroke-width="2.5" marker-end="url(#a5F6B7A)"/><line x1="760" y1="235" x2="776" y2="235" stroke="#5F6B7A" stroke-width="2.5" marker-end="url(#a5F6B7A)"/><line x1="950" y1="235" x2="966" y2="235" stroke="#5F6B7A" stroke-width="2.5" marker-end="url(#a5F6B7A)"/><text x="780" y="312" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#B42318" font-weight="bold" text-anchor="middle" >Either check stops the upload and names the file to fix.</text><rect x="400" y="340" width="740" height="120" rx="6" fill="#F2F5F9" stroke="#C9D2DD" stroke-width="1"/><text x="420" y="368" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0B2545" font-weight="bold" text-anchor="start" letter-spacing="1">WHAT THE CHECKS BLOCK</text><rect x="420" y="385" width="10" height="10" fill="#B42318"/><text x="438" y="395" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F2A37" font-weight="normal" text-anchor="start" >AWS account numbers (12 digits)</text><rect x="780" y="385" width="10" height="10" fill="#B42318"/><text x="798" y="395" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F2A37" font-weight="normal" text-anchor="start" >AWS sign-in addresses (awsapps.com)</text><rect x="420" y="409" width="10" height="10" fill="#B42318"/><text x="438" y="419" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F2A37" font-weight="normal" text-anchor="start" >Email addresses</text><rect x="780" y="409" width="10" height="10" fill="#B42318"/><text x="798" y="419" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F2A37" font-weight="normal" text-anchor="start" >Access keys and private keys</text><rect x="420" y="433" width="10" height="10" fill="#B42318"/><text x="438" y="443" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F2A37" font-weight="normal" text-anchor="start" >Anything from curwork_test.env</text><rect x="780" y="433" width="10" height="10" fill="#B42318"/><text x="798" y="443" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F2A37" font-weight="normal" text-anchor="start" >Hidden tags inside image files</text><line x1="40" y1="514" x2="1160" y2="514" stroke="#C9D2DD" stroke-width="1"/><text x="40" y="536" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5F6B7A" font-weight="normal" text-anchor="start" >Also run on every file by test menu option 8. NIST SP 800-53 AC-22 (keeping sensitive details out of public places).</text><text x="1160" y="536" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5F6B7A" font-weight="normal" text-anchor="end" >CurWork Beta 0.016 · DRAFT - For Internal Use (FPT)</text></svg>