em, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0F8B80" font-weight="bold" text-anchor="start" >NIST SC-8</text><rect x="610" y="562" width="255" height="58" rx="6" fill="#FFFFFF" stroke="#1F4E89" stroke-width="1.2"/><text x="624" y="587" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#0B2545" font-weight="bold" text-anchor="start" >Encrypted at rest (SSE-KMS)</text><text x="624" y="607" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0F8B80" font-weight="bold" text-anchor="start" >NIST SC-28</text><rect x="885" y="562" width="255" height="58" rx="6" fill="#FFFFFF" stroke="#1F4E89" stroke-width="1.2"/><text x="899" y="587" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#0B2545" font-weight="bold" text-anchor="start" >Old copies kept 30 days</text><text x="899" y="607" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0F8B80" font-weight="bold" text-anchor="start" >NIST CP-9</text><line x1="40" y1="654" x2="1160" y2="654" stroke="#C9D2DD" stroke-width="1"/><text x="40" y="676" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5F6B7A" font-weight="normal" text-anchor="start" >Source: iam/biller_permission_set_policy.json and iam/bucket_policy_additions.json. Mac test results, 2026-11-22.</text><text x="1160" y="676" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5F6B7A" font-weight="normal" text-anchor="end" >CurWork Beta 0.015 · DRAFT - For Internal Use (FPT)</text></svg>