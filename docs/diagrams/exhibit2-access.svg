<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><defs><marker id="a5F6B7A" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5F6B7A"/></marker><marker id="a0F8B80" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F8B80"/></marker><marker id="a0B2545" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B2545"/></marker><marker id="aB42318" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker><marker id="a1F4E89" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E89"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="42" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0F8B80" font-weight="bold" text-anchor="start" letter-spacing="1.5">EXHIBIT 2</text><text x="40" y="72" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#0B2545" font-weight="bold" text-anchor="start" >What a biller can and can't do</text><text x="40" y="98" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5F6B7A" font-weight="normal" text-anchor="start" >Access is limited to exactly what the four steps need. Real-AWS tests prove the refusals on every run.</text><line x1="40" y1="114" x2="1160" y2="114" stroke="#0B2545" stroke-width="2"/><rect x="40" y="140" width="300" height="330" rx="6" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.5"/><rect x="40" y="140" width="300" height="44" rx="6" fill="#0B2545" stroke="#0B2545" stroke-width="1"/><text x="60" y="168" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="start" >Biller signs in</text><text x="60" y="212" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1F2A37" font-weight="normal" text-anchor="start" >Company single sign-on</text><text x="60" y="233" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1F2A37" font-weight="normal" text-anchor="start" >through IAM Identity Center,</text><text x="60" y="254" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1F2A37" font-weight="normal" text-anchor="start" >with the company's MFA.</text><text x="60" y="290" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1F2A37" font-weight="normal" text-anchor="start" >Gets short-lived AWS access</text><text x="60" y="311" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1F2A37" font-weight="normal" text-anchor="start" >that expires by itself</text><text x="60" y="332" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1F2A37" font-weight="normal" text-anchor="start" >(8 hours in testing).</text><text x="60" y="368" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1F2A37" font-weight="normal" text-anchor="start" >No passwords or keys are</text><text x="60" y="389" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1F2A37" font-weight="normal" text-anchor="start" >ever stored in CurWork.</text><text x="60" y="440" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0F8B80" font-weight="bold" text-anchor="start" >NIST  IA-2 · IA-5 · AC-12</text><line x1="340" y1="300" x2="392" y2="300" stroke="#0B2545" stroke-width="2.5" marker-end="url(#a0B2545)"/><rect x="400" y="140" width="760" height="44" rx="6" fill="#0B2545" stroke="#0B2545" stroke-width="1"/><text x="416" y="168" font-family="-apple-sys