<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><defs><marker id="a5F6B7A" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5F6B7A"/></marker><marker id="a0F8B80" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F8B80"/></marker><marker id="a0B2545" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B2545"/></marker><marker id="aB42318" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker><marker id="a1F4E89" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E89"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="42" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0F8B80" font-weight="bold" text-anchor="start" letter-spacing="1.5">EXHIBIT 1</text><text x="40" y="72" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#0B2545" font-weight="bold" text-anchor="start" >How CurWork moves files</text><text x="40" y="98" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5F6B7A" font-weight="normal" text-anchor="start" >Workbooks only touch the laptop between download and clean-up. The Excel macros don't change.</text><line x1="40" y1="114" x2="1160" y2="114" stroke="#0B2545" stroke-width="2"/><rect x="40" y="134" width="1120" height="150" rx="8" fill="#EAF1FA" stroke="#C7D7EC" stroke-width="1"/><text x="60" y="160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1F4E89" font-weight="bold" text-anchor="start" letter-spacing="1">AMAZON S3  ·  encrypted, private bucket</text><rect x="40" y="330" width="1120" height="220" rx="8" fill="#F4F6F8" stroke="#C9D2DD" stroke-width="1"/><text x="60" y="537" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5F6B7A" font-weight="bold" text-anchor="start" letter-spacing="1">BILLER'S LAPTOP  ·  CurWork work folder</text><rect x="70" y="176" width="260" height="86" rx="6" fill="#FFFFFF" stroke="#1F4E89" stroke-width="1.5"/><text x="90" y="204" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0B2545" font-weight="bold" text-anchor="start" >converted/</text><text x="90" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B7A" font-weight="normal" text-anchor="start" >Input workbooks, one folder</text><text x="90" y="246" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B7A" font-weight="normal" text-anchor="start" >per customer and month</text><rect x="470" y="176" width="330" height="86" rx="6" fill="#FFFFFF" stroke="#1F4E89" stroke-width="1.5"/><text x="490" y="204" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0B2545" font-weight="bold" text-anchor="start" >priced/  allocated/  mapped/ …</text><text x="490" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B7A" font-weight="normal" text-anchor="start" >Results, in the folder for the</text><text x="490" y="246" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B7A" font-weight="normal" text-anchor="start" >result type the biller picks</text><rect x="930" y="176" width="200" height="86" rx="6" fill="#FFFFFF" stroke="#1F4E89" stroke-width="1.5"/><text x="950" y="204" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0B2545" font-weight="bold" text-anchor="start" >logs/</text><text x="950" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B7A" font-weight="normal" text-anchor="start" >One log per biller per</text><text x="950" y="246" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B7A" font-weight="normal" text-anchor="start" >day, for support and audit</text><rect x="70" y="372" width="200" height="130" rx="6" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.5"/><text x="90" y="402" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0B2545" font-weight="bold" text-anchor="start" >In folder</text><text x="90" y="426" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B7A" font-weight="normal" text-anchor="start" >Downloaded copies.</text><text x="90" y="444" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B7A" font-weight="normal" text-anchor="start" >Open them from here.</text><rect x="330" y="372" width="220" height="130" rx="6" fill="#0B2545" stroke="#0B2545" stroke-width="1.5"/><text x="350" y="402" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#FFFFFF" font-weight="bold" text-anchor="start" >Excel macros</text><text x="350" y="426" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#DCE6F2" font-weight="normal" text-anchor="start" >The same VBA macros</text><text x="350" y="444" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#DCE6F2" font-weight="normal" text-anchor="start" >as today. No changes.</text><rect x="610" y="372" width="200" height="130" rx="6" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.5"/><text x="630" y="402" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0B2545" font-weight="bold" text-anchor="start" >Out folder</text><text x="630" y="426" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B7A" font-weight="normal" text-anchor="start" >Results saved here.</text><text x="630" y="444" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B7A" font-weight="normal" text-anchor="start" >Shows what's saved in S3.</text><rect x="870" y="372" width="260" height="130" rx="6" fill="#FFFFFF" stroke="#0F8B80" stroke-width="2"/><text x="890" y="402" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0F8B80" font-weight="bold" text-anchor="start" >Finish and clean up</text><text x="890" y="426" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B7A" font-weight="normal" text-anchor="start" >Checks nothing is open or</text><text x="890" y="444" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B7A" font-weight="normal" text-anchor="start" >waiting, saves the log in S3,</text><text x="890" y="462" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B7A" font-weight="normal" text-anchor="start" >then empties In and Out.</text><path d="M200,262 L200,370" fill="none" stroke="#0F8B80" stroke-width="2.5" marker-end="url(#a0F8B80)"/><circle cx="200" cy="316" r="13" fill="#0F8B80"/><text x="200" y="321" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >1</text><text x="222" y="304" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#0F8B80" font-weight="bold" text-anchor="start" >Download</text><text x="222" y="320" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#0F8B80" font-weight="bold" text-anchor="start" >secure connection</text><line x1="270" y1="445" x2="322" y2="445" stroke="#5F6B7A" stroke-width="2" marker-end="url(#a5F6B7A)"/><line x1="550" y1="445"